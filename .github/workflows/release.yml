name: Release

# Deliberate release tags only — bare semver (CLAUDE.md § Release process), never on every push. Publish design: docs/plan/npm-trusted-publishing.md.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Tag matches the manifest and the CHANGELOG
        run: |
          test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          grep -q "^## \[$GITHUB_REF_NAME\]" CHANGELOG.md

      - name: Packed tarball starts and reports the tag version
        run: |
          mkdir "$RUNNER_TEMP/pack" "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/home"
          npm pack --silent --pack-destination "$RUNNER_TEMP/pack" > /dev/null
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | HOME="$RUNNER_TEMP/home" timeout 30 node node_modules/@akinet/akimcp/bin/akimcp.js --stdio \
            | head -n 1 | grep -F "\"serverInfo\":{\"name\":\"akimcp\",\"version\":\"$GITHUB_REF_NAME\""

  # No dependency is installed here, so no third-party code runs while the OIDC token exists.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Trusted publishing needs npm 11.5.1 or newer; Node 22.14.0 ships an older one
        run: npm install -g npm@11.21.0

      - name: Publish unless this version is already on the registry
        run: |
          PKG=$(node -p "require('./package.json').name")
          if [ "$(npm view "$PKG@$GITHUB_REF_NAME" version 2>/dev/null)" = "$GITHUB_REF_NAME" ]; then
            echo "$PKG@$GITHUB_REF_NAME is already published"
            exit 0
          fi
          npm publish
          for attempt in 1 2 3 4 5; do
            [ "$(npm view "$PKG@$GITHUB_REF_NAME" version 2>/dev/null)" = "$GITHUB_REF_NAME" ] && exit 0
            sleep 6
          done
          echo "::error::$PKG@$GITHUB_REF_NAME is not visible on the registry after publish"
          exit 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          # release.B4: body must carry the tagged CHANGELOG section, not a bare --generate-notes (near-empty on this repo — commits go straight to trunk, no PR history for it to derive from) plus a compare-link footer.
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag
          ' CHANGELOG.md > /tmp/changelog-section.md
          # Bare-semver tags only (release.yml's own trigger pattern) -- legacy v1.x.x tags (CLAUDE.md: "immutable history") sort ahead of them lexically and would pick the wrong "previous" release otherwise.
          PREV_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          {
            cat /tmp/changelog-section.md
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
